<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c100a" />
    <title>Salakivi kell</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #0c100a;
        color: #fff;
        font: 700 16px/1.25 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        height: 100%;
        overflow: auto;
        -webkit-text-size-adjust: 100%;
      }
      #app {
        min-height: 100%;
        padding: 6px 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: stretch;
        justify-content: flex-start;
      }
      .wait,
      .title {
        margin: 0;
        color: #fff;
        font-size: 18px;
        font-weight: 800;
        text-shadow: 0 1px 2px #000;
      }
      .sub {
        margin: 0;
        color: #e8e4d4;
        font-size: 14px;
        font-weight: 600;
      }
      .clock {
        margin: 0;
        font-size: 40px;
        letter-spacing: 0.04em;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      button {
        width: 100%;
        min-height: 40px;
        border: 0;
        border-radius: 10px;
        font: 800 20px/1 -apple-system, system-ui, sans-serif;
        padding: 8px;
      }
      .start {
        background: #4ade80;
        color: #052e16;
      }
      .tehtud {
        background: #f5e06a;
        color: #2a2408;
      }
      .ghost {
        background: #2c3424;
        color: #fff;
        font-size: 15px;
        min-height: 32px;
      }
      .pair {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 7px 8px;
        border: 0;
        border-radius: 8px;
        background: #22281c;
        color: #f2f0e8;
        font-size: 15px;
        min-height: 34px;
        text-align: left;
      }
      .pair.on {
        background: #f5e06a;
        color: #2a2408;
      }
      input {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #445533;
        background: #1a1e16;
        color: #fff;
        font-size: 16px;
      }
      .err {
        margin: 0;
        color: #ff7a6e;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <p class="title">Salakivi kell</p>
      <p class="sub">Ava telefonis Seaded → Kopeeri Apple link (lühike ?p=) ja ava see kellas.</p>
    </div>
    <script src="kell.js"></script>
  </body>
</html>
