<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12140f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="portrait" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Salakivi Treening</title>
    <style>
      html,
      body {
        margin: 0;
        background: #12140f;
        color: #fff;
      }
      #kell-boot {
        display: none;
        padding: 8px;
        font: 800 18px/1.3 -apple-system, system-ui, sans-serif;
        color: #fff;
      }
    </style>
    <script>
      (function () {
        var search = location.search || ''
        var isWatch = /(?:\?|&)kell=(?:1|galaxy|apple)(?:&|$)/.test(search)
        if (!isWatch) return
        document.documentElement.className += ' is-watch'
        if (/(?:\?|&)kell=apple(?:&|$)/.test(search) && !/kell\.html/i.test(location.pathname)) {
          var path = location.pathname.replace(/index\.html$/i, '')
          if (path.slice(-1) !== '/') path += '/'
          location.replace(path + 'kell.html' + search)
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="sk-fonts"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
      media="print"
    />
    <script>
      if (!/(?:\?|&)kell=/.test(location.search || '')) {
        var fonts = document.getElementById('sk-fonts')
        if (fonts) fonts.media = 'all'
      }
    </script>
  </head>
  <body>
    <div id="root">
      <p id="kell-boot">Salakivi kell<br />Ootan…</p>
    </div>
    <script>
      if (/(?:\?|&)kell=/.test(location.search || '')) {
        var boot = document.getElementById('kell-boot')
        if (boot) boot.style.display = 'block'
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
